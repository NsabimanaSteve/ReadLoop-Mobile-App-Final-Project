name: readloop
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Local Storage & Offline Support
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  # Network & API
  http: ^1.6.0

  # Camera & Barcode Scanning
  camera: ^0.10.6
  mobile_scanner: ^3.5.7

  # Location Services
  geolocator: ^10.1.1
  geocoding: ^2.2.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Google Books API
  dio: ^5.4.3+1

  # Image Handling
  image_picker: ^1.0.7

  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.19.0
  permission_handler: ^11.4.0

  # File Handling
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
